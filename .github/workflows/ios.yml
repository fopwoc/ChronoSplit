name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iPhone and Apple Watch
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test shared iOS code and build Kotlin framework
        run: >-
          ./gradlew --no-daemon
          :shared:models:iosSimulatorArm64Test
          :app:appShared:iosSimulatorArm64Test
          :app:iosApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iPhone app and embedded watch app
        run: |
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ChronoSplitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            FRAMEWORK_SEARCH_PATHS="$GITHUB_WORKSPACE/app/iosApp/build/bin/iosSimulatorArm64/debugFramework" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build
