[versions]
java = "25"
kotlin = "2.4.10"
serialization = "1.11.0"
datetime = "0.8.0"
coroutines = "1.11.0"
compose = "1.11.1"
ktor = "3.5.2"
room3 = "3.0.0"
sqlite = "2.7.0"
androidxLifecycle = "2.10.0"
ksp = "2.3.8"
logback = "1.6.3"
androidGradle = "9.3.0"
androidSdk = "37"
androidxActivity = "1.13.0"
androidxCompose = "1.11.4"
androidxMaterial3 = "1.4.0"
androidxNavigation3 = "1.1.4"

[libraries]
test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
